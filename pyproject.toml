[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sud-cli"
version = "2.9.1"
description = "Offline Phase 1 foundation for the sud-cli court-document toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "lnfnt", email = "lnfnt@proton.me" },
]
keywords = ["court", "npa", "offline", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31",
]

[project.scripts]
sud-cli = "sud_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sud_cli", "sud_cli._secure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
